<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <meta name="csrf-token" content="${_csrf.token}">

    <title>Comptes Management</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"> <!-- FontAwesome Icons -->
    <style>
        .table th, .table td {
            text-align: center;
            padding: 12px 15px;
        }
        .btn-custom {
            background-color: #007bff;
            color: white;
        }
        .btn-custom:hover {
            background-color: #0056b3;
        }
        .page-header {
            margin-bottom: 30px;
        }
        .table-container {
            margin-top: 30px;
        }
        .table td, .table th {
            text-align: center;
            vertical-align: middle;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 10px; /* Space between buttons */
        }
        /* Sidebar Styles */
        .sidebar {
            height: 100%;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #343a40;
            color: white;
            padding-top: 20px;
            padding-left: 20px;
        }
        .sidebar a {
            color: white;
            padding: 10px;
            text-decoration: none;
            display: block;
            margin: 5px 0;
        }
        .sidebar a:hover {
            background-color: #007bff;
        }
        .content {
            margin-left: 250px;
            padding: 20px;
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h3>Comptes Management</h3>
    <a href="/comptes">Comptes</a>
    <a href="/clients">Clients</a>
    <a href="#" th:text="${username}">Username</a>
    <a href="/logout">Logout</a>
</div>

<!-- Main Content -->
<div class="content">
    <div class="page-header">
        <h1>Create New Compte</h1>
    </div>

    <form th:action="@{/comptes}" method="post">
        <div class="form-group">
            <label for="clientCin">Client CIN:</label>
            <select id="clientCin" name="clientCin" class="form-control" required>
                <option value="" disabled selected>Select a Client</option>
                <tr th:each="client : ${clients}">
                    <option th:value="${client.cin}" th:text="${client.nomComplet}"></option>
                </tr>
            </select>
        </div>

        <div class="form-group mt-3">
            <label for="solde">Balance:</label>
            <input type="number" id="solde" name="solde" class="form-control" placeholder="Enter Balance" required />
        </div>

        <button type="submit" class="btn btn-custom mt-3">Save</button>
    </form>

    <!-- List of Comptes -->
    <div class="page-header mt-4">
        <h2>List of Comptes</h2>
    </div>

    <div class="container">
        <div class="table-container">
            <h2 class="mb-4">Comptes</h2>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <!-- Table of Comptes -->
            <table class="table table-hover">
                <thead class="table-dark">
                <tr>
                    <th>RIB</th>
                    <th>Client Name</th>
                    <th>Balance</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="compte : ${comptes}" th:data-rib="${compte.rib}">
                    <td th:text="${compte.rib}"></td>
                    <td th:text="${compte.client.nomComplet}"></td>
                    <td th:text="${compte.solde}"></td>
                    <td>
                        <!-- Action buttons in the same line -->
                        <div class="action-buttons">
                            <!-- Edit Button with Icon -->
                            <a class="btn btn-secondary" th:href="@{'/comptes/' + ${compte.rib}}">
                                <i class="fas fa-edit"></i> Edit
                            </a>

                            <!-- Delete Button with Icon and Confirmation -->
                            <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteConfirmModal"
                                    th:data-rib="${compte.rib}">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal for Confirming Deletion -->
<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteConfirmModalLabel">Confirm Deletion</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete this compte?
            </div>
            <div class="modal-footer">
                <form id="deleteForm" method="POST" action="">
                    <!-- CSRF Token for Spring -->
                    <input type="hidden" name="_csrf" value="${_csrf.token}">

                    <button type="submit" id="confirmDeleteBtn" class="btn btn-danger">Yes</button>
                </form>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    // Capture RIB for deletion
    $(document).on('click', '.btn-danger', function () {
        const ribToDelete = $(this).data('rib');
        console.log("Captured RIB:", ribToDelete);

        // Check if ribToDelete is valid
        if (!ribToDelete) {
            console.error("RIB is null or empty.");
            return;
        }

        // Open the confirmation modal
        $('#deleteConfirmModal').modal('show');

        // Attach RIB to the confirmation button
        $('#confirmDeleteBtn').data('rib', ribToDelete);
    });

    // Handle deletion after confirmation
    $('#confirmDeleteBtn').on('click', function (e) {
        e.preventDefault(); // Prevent default behavior

        const ribToDelete = $(this).data('rib');
        console.log("Deleting account with RIB:", ribToDelete);

        // Show a loading message using SweetAlert
        Swal.fire({
            title: 'Deleting...',
            text: 'Please wait while the account is being deleted.',
            didOpen: () => {
                Swal.showLoading();
            }
        });

        // Send the AJAX DELETE request
        $.ajax({
            url: `/comptes/delete/${ribToDelete}`, // Endpoint for deletion
            type: 'DELETE', // HTTP method
            headers: {
                'X-CSRF-TOKEN': $('input[name="_csrf"]').val() // CSRF token for Spring Security
            },
            success: function (response) {
                // Success - Hide modal and remove row
                Swal.fire('Deleted!', 'The compte has been deleted.', 'success')
                    .then(() => {
                        $(`tr[data-rib="${ribToDelete}"]`).remove(); // Remove row dynamically
                        $('#deleteConfirmModal').modal('hide'); // Hide the modal
                    });
            },
            error: function (xhr, status, error) {
                // Error handling
                Swal.fire('Error!', 'There was a problem deleting the compte.', 'error');
                console.error("Error status:", status, "Error:", error);
            },
            complete: function () {
                // Always close the loading state
                Swal.close();
            }
        });
    });
</script>
</body>

</html>
