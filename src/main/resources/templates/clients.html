<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clients Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">

    <!-- Include SweetAlert library -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.3.1/dist/sweetalert2.all.min.js"></script>

    <!-- Include jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
      background-color: #eef1f5;
      display: flex;
      font-family: 'Arial', sans-serif;
      color: #333;
  }

  /* Sidebar Styling */
  .sidebar {
      width: 250px;
      background-color: #1f2937; /* Dark Navy Blue */
      color: white;
      height: 100vh;
      position: fixed;
      padding-top: 20px;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
  }

  .sidebar h4 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.2rem;
      font-weight: bold;
  }

  .sidebar a {
      padding: 15px;
      display: block;
      color: #f8f9fa;
      text-decoration: none;
      font-size: 1rem;
      transition: 0.3s;
  }

  .sidebar a:hover {
      background-color: #2563eb; /* Modern Blue */
      color: white;
  }

  .sidebar .active {
      background-color: #2563eb;
  }

  /* Main Content */
  .content {
      margin-left: 260px;
      padding: 20px;
      width: 100%;
  }

  /* Table Styling */
  .table-container {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
  }

  .table thead {
      background-color: #2563eb;
      color: white;
  }

  /* Buttons */
  .btn-primary {
      background-color: #2563eb;
      border-color: #2563eb;
      transition: 0.3s;
  }

  .btn-primary:hover {
      background-color: #1d4ed8;
      border-color: #1d4ed8;
  }

  .btn-warning {
      background-color: #f59e0b;
      border-color: #f59e0b;
      color: white;
  }

  .btn-warning:hover {
      background-color: #d97706;
      border-color: #d97706;
  }

  .btn-danger {
      background-color: #dc2626;
      border-color: #dc2626;
  }

  .btn-danger:hover {
      background-color: #b91c1c;
      border-color: #b91c1c;
  }

  /* Modal Header */
  .modal-header {
      background-color: #2563eb;
      color: white;
  }
    </style>
</head>
<body>
<input type="hidden" name="_csrf" value="${_csrf.token}">

<!-- Sidebar -->
<div class="sidebar">
    <h4 class="text-center">Management System</h4>
    <a href="/comptes">Comptes</a>
    <a href="/clients" class="active">Clients</a>
    <a href="#" th:text="${username}">Username</a>
    <a href="/logout">Logout</a>
</div>

<!-- Main Content -->
<div class="content">
    <div class="table-container">
        <h2 class="mb-4">Clients Management</h2>

        <!-- Success or Error Message -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Table of Clients -->
        <table class="table table-hover">
            <thead class="table-dark">
            <tr>
                <th>CIN</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="client : ${clients}">
                <td th:text="${client.cin}"></td>
                <td th:text="${client.nom}"></td>
                <td th:text="${client.prenom}"></td>
                <td>
                    <button class="btn btn-danger btn-sm delete-btn"
                            th:attr="data-cin=${client.cin}" >
                        Delete
                    </button>
                    <button class="btn btn-warning btn-sm edit-btn" data-bs-toggle="modal" data-bs-target="#clientModal"
                            th:attr="data-cin=${client.cin}, data-nom=${client.nom}, data-prenom=${client.prenom}">
                        Edit
                    </button>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Button to Add New Client -->
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#clientModal">Add Client</button>
    </div>
</div>

<!-- Modal for Add/Edit Client -->
<div class="modal fade" id="clientModal" tabindex="-1" aria-labelledby="clientModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="clientModalLabel">Add/Edit Client</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="clientForm" th:action="@{/clients/save}" method="post">
                    <input type="hidden" id="editMode" name="editMode" value="false">
                    <div class="mb-3">
                        <label for="cin" class="form-label">CIN</label>
                        <input type="text" class="form-control" id="cin" name="cin" required>
                    </div>
                    <div class="mb-3">
                        <label for="nom" class="form-label">Nom</label>
                        <input type="text" class="form-control" id="nom" name="nom" required>
                    </div>
                    <div class="mb-3">
                        <label for="prenom" class="form-label">Prénom</label>
                        <input type="text" class="form-control" id="prenom" name="prenom" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript -->
<script>
    // Populate Edit Modal
    document.querySelectorAll('.edit-btn').forEach(button => {
        button.addEventListener('click', function () {
            const cin = this.getAttribute('data-cin');
            const nom = this.getAttribute('data-nom');
            const prenom = this.getAttribute('data-prenom');

            document.getElementById('cin').value = cin;
            document.getElementById('nom').value = nom;
            document.getElementById('prenom').value = prenom;

            document.getElementById('clientForm').setAttribute('th:action', `/clients/edit/${cin}`);
            document.getElementById('editMode').value = 'true';
        });
    });

    $(document).ready(function() {
        // Handle Delete button click event
        $('.delete-btn').click(function() {
            var cinToDelete = $(this).data('cin');

            // Confirm deletion using SweetAlert
            Swal.fire({
                title: 'Are you sure?',
                text: "This client will be permanently deleted!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, delete it!',
                cancelButtonText: 'Cancel'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Send the DELETE request using AJAX
                    $.ajax({
                        url: `/clients/delete/${cinToDelete}`,
                        type: 'POST',
                        data: {
                            "_csrf": $('input[name="_csrf"]').val(),
                            "cin": cinToDelete
                        },
                        success: function(response) {
                            Swal.fire(
                                'Deleted!',
                                'The client has been deleted.',
                                'success'
                            );
                            $(`[data-cin="${cinToDelete}"]`).closest('tr').remove();
                        },
                        error: function(xhr, status, error) {
                            Swal.fire(
                                'Error!',
                                'There was an issue deleting the client.',
                                'error'
                            );
                        }
                    });
                }
            });
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
