<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Compte</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"> <!-- FontAwesome icons -->

    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fa;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center; /* Center content horizontally */
            align-items: center; /* Center content vertically */
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
            display: flex;
            justify-content: center; /* Center modal horizontally */
            align-items: center; /* Center modal vertically */
            z-index: 9999;
        }

        /* Modal Container */
        .modal-container {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            width: 320px; /* Fixed width */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Modal Title */
        h1 {
            font-size: 18px;
            color: #333;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* Form Styles */
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }

        /* Form Label */
        label {
            font-size: 14px;
            color: #555;
        }

        /* Input and Select Fields */
        input, select {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            transition: border-color 0.3s ease;
            height: 32px;
        }

        input:focus, select:focus {
            border-color: #0066cc;
            outline: none;
        }

        /* Submit Button */
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #005bb5;
        }

        /* Close Button */
        .close-btn {
            background-color: transparent;
            border: none;
            font-size: 20px;
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            color: #333;
        }

        .close-btn:hover {
            color: #ff4d4d;
        }

        /* Responsive Design */
        @media screen and (max-width: 768px) {
            .modal-container {
                width: 90%;
            }
        }
    </style>
</head>
<body>

    <!-- Modal Overlay -->
    <div class="modal-overlay">
        <div class="modal-container">
            <!-- Close Button -->
            <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>

            <!-- Modal Title -->
            <h1>Update Compte</h1>

            <!-- Modal Form -->
            <form th:action="@{/comptes/{rib}/update(rib=${compte.rib})}" th:object="${compte}" method="post">
                <label for="solde">Balance:</label>
                <input type="number" id="solde" name="solde" th:value="${compte.solde}" required />

                <label for="clientCin">Client:</label>
                <select id="clientCin" name="clientCin" required>
                    <option value="" disabled>Select a Client</option>
                    <option th:value="${client.cin}" th:text="${client.nomComplet}" th:each="client : ${clients}"
                        th:selected="${compte.client.cin == client.cin}"></option>
                </select>

                <button type="submit">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </form>
        </div>
    </div>

    <script>
        // JavaScript function to close the modal
        function closeModal() {
            document.querySelector('.modal-overlay').style.display = 'none';
        }
    </script>

</body>
</html>
